name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore

      - name: Inject Supabase config
        shell: pwsh
        run: |
          $json = Get-Content wwwroot/appsettings.Production.json -Raw | ConvertFrom-Json
          $json.supabase.ARCAN_SUPABASE_URL = $env:SUPABASE_URL
          $json.supabase.ARCAN_SUPABASE_ANON_KEY = $env:SUPABASE_ANON_KEY
          $json | ConvertTo-Json -Depth 10 | Set-Content wwwroot/appsettings.Production.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build and Publish
        run: dotnet publish CoachManagerPwa.csproj -c Release -o ./publish

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        run: |
          wrangler pages deploy ./publish/wwwroot \
            --project-name=arcanisrael \
            --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment Summary
        run: |
          echo "✅ Deployment to Cloudflare Pages completed!"
          echo "🔗 Your app is live at: https://arcanisrael.pages.dev"
